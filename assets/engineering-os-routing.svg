<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title description">
  <title id="title">Engineering OS context-gated routing map</title>
  <desc id="description">The routing default is no skill. At most one working capability is exposed. Research Before Solution, Causal Debugging, and Testing may activate automatically. Incident Control may persist as supervisory context. Execution Planning, Adversarial Review, Knowledge Promotion, Threat Modeling, and Operational Readiness require an explicit user request. Ordinary actions never trigger skills.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#11172b"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="automatic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="requested" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.72"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#94a3b8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .eyebrow { fill: #7dd3fc; font: 600 18px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 4px; }
      .heading { fill: #f8fafc; font: 700 40px Inter, ui-sans-serif, system-ui, sans-serif; }
      .section { fill: #cbd5e1; font: 650 17px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 2.5px; }
      .label { fill: #f8fafc; font: 650 21px Inter, ui-sans-serif, system-ui, sans-serif; }
      .requested-label { fill: #f8fafc; font: 650 17px Inter, ui-sans-serif, system-ui, sans-serif; }
      .sub { fill: #9eacc2; font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; }
      .core-small { fill: #bae6fd; font: 650 16px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 2px; }
      .core-large { fill: #ffffff; font: 760 37px Inter, ui-sans-serif, system-ui, sans-serif; }
      .pill { fill: #cbd5e1; font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; }
      .connector { fill: none; stroke: #475569; stroke-width: 2; stroke-dasharray: 5 9; }
    </style>
  </defs>

  <rect width="1600" height="920" rx="30" fill="url(#background)"/>
  <rect width="1600" height="920" rx="30" fill="url(#grid)"/>
  <circle cx="800" cy="460" r="330" fill="#2563eb" opacity="0.035"/>
  <circle cx="220" cy="760" r="300" fill="#0891b2" opacity="0.055"/>
  <circle cx="1390" cy="130" r="260" fill="#7c3aed" opacity="0.055"/>

  <text x="72" y="72" class="eyebrow">ENGINEERING OS</text>
  <text x="72" y="122" class="heading">Context-gated capability routing</text>
  <text x="72" y="154" class="sub">Start with no working skill. Expose one only when the unresolved responsibility demands it.</text>

  <text x="72" y="218" class="section">AUTOMATIC WORKING SKILLS AND INCIDENT SUPERVISION</text>
  <line x1="72" y1="234" x2="1528" y2="234" stroke="url(#automatic)" stroke-opacity="0.5"/>

  <g filter="url(#shadow)">
    <rect x="72" y="258" width="310" height="130" rx="20" fill="#0f1c2e" stroke="#22d3ee" stroke-opacity="0.72"/>
    <rect x="72" y="258" width="7" height="130" rx="3" fill="url(#automatic)"/>
    <circle cx="112" cy="302" r="10" fill="#22d3ee"/>
    <text x="139" y="309" class="label">Research Before Solution</text>
    <text x="104" y="344" class="sub">Material decision uncertainty can change</text>
    <text x="104" y="366" class="sub">the options or their ranking.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="454" y="258" width="310" height="130" rx="20" fill="#101a2c" stroke="#60a5fa" stroke-opacity="0.72"/>
    <rect x="454" y="258" width="7" height="130" rx="3" fill="url(#automatic)"/>
    <circle cx="494" cy="302" r="10" fill="#60a5fa"/>
    <text x="521" y="309" class="label">Causal Debugging</text>
    <text x="486" y="344" class="sub">An observed failure needs controlled</text>
    <text x="486" y="366" class="sub">reproduction and causal isolation.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="836" y="258" width="310" height="130" rx="20" fill="#101a2c" stroke="#60a5fa" stroke-opacity="0.72"/>
    <rect x="836" y="258" width="7" height="130" rx="3" fill="url(#automatic)"/>
    <circle cx="876" cy="302" r="10" fill="#60a5fa"/>
    <text x="903" y="309" class="label">Testing</text>
    <text x="868" y="344" class="sub">Test evidence design or change</text>
    <text x="868" y="366" class="sub">becomes the active responsibility.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1218" y="258" width="310" height="130" rx="20" fill="#18182a" stroke="#f59e0b" stroke-opacity="0.72"/>
    <rect x="1218" y="258" width="7" height="130" rx="3" fill="#f59e0b"/>
    <circle cx="1258" cy="302" r="10" fill="#fbbf24"/>
    <text x="1285" y="309" class="label">Incident Control</text>
    <text x="1250" y="344" class="sub">Supervises production harm, recovery,</text>
    <text x="1250" y="366" class="sub">and incident monitoring.</text>
  </g>

  <path d="M 382 323 C 500 323, 565 444, 650 444" class="connector"/>
  <path d="M 609 388 C 660 410, 700 432, 730 444" class="connector"/>
  <path d="M 991 388 C 940 410, 900 432, 870 444" class="connector"/>
  <path d="M 1218 323 C 1100 323, 1035 444, 950 444" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="648" y="420" width="304" height="170" rx="38" fill="#0b1324" stroke="url(#core)" stroke-width="3"/>
    <rect x="665" y="437" width="270" height="136" rx="28" fill="url(#core)" opacity="0.14"/>
    <circle cx="800" cy="466" r="9" fill="#38bdf8" filter="url(#glow)"/>
    <text x="800" y="506" text-anchor="middle" class="core-small">DEFAULT ROUTE</text>
    <text x="800" y="551" text-anchor="middle" class="core-large">NO SKILL</text>
  </g>

  <rect x="316" y="451" width="118" height="40" rx="20" fill="#172033" stroke="#334155"/>
  <text x="375" y="476" text-anchor="middle" class="pill">BUILD</text>
  <rect x="447" y="451" width="118" height="40" rx="20" fill="#172033" stroke="#334155"/>
  <text x="506" y="476" text-anchor="middle" class="pill">TEST</text>
  <rect x="1035" y="451" width="118" height="40" rx="20" fill="#172033" stroke="#334155"/>
  <text x="1094" y="476" text-anchor="middle" class="pill">VERIFY</text>
  <rect x="1166" y="451" width="118" height="40" rx="20" fill="#172033" stroke="#334155"/>
  <text x="1225" y="476" text-anchor="middle" class="pill">DEPLOY</text>
  <text x="800" y="620" text-anchor="middle" class="sub">Ordinary actions remain inside the current task and never trigger a capability by themselves.</text>

  <text x="72" y="686" class="section">REQUEST-ONLY CAPABILITIES</text>
  <line x1="72" y1="702" x2="1528" y2="702" stroke="url(#requested)" stroke-opacity="0.5"/>

  <g filter="url(#shadow)">
    <rect x="72" y="728" width="264" height="118" rx="20" fill="#14172a" stroke="#9f7aea" stroke-opacity="0.68"/>
    <circle cx="100" cy="769" r="8" fill="#9f7aea"/>
    <text x="120" y="775" class="requested-label">Execution Planning</text>
    <text x="100" y="808" class="sub">Hazardous transition</text>
    <text x="100" y="829" class="sub">plan</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="370" y="728" width="264" height="118" rx="20" fill="#14172a" stroke="#a78bfa" stroke-opacity="0.68"/>
    <circle cx="398" cy="769" r="8" fill="#a78bfa"/>
    <text x="418" y="775" class="requested-label">Adversarial Review</text>
    <text x="398" y="808" class="sub">Independent change</text>
    <text x="398" y="829" class="sub">challenge</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="668" y="728" width="264" height="118" rx="20" fill="#14172a" stroke="#b084f7" stroke-opacity="0.68"/>
    <circle cx="696" cy="769" r="8" fill="#b084f7"/>
    <text x="716" y="775" class="requested-label">Knowledge Promotion</text>
    <text x="696" y="808" class="sub">Durable knowledge</text>
    <text x="696" y="829" class="sub">capture</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="966" y="728" width="264" height="118" rx="20" fill="#14172a" stroke="#b987f8" stroke-opacity="0.68"/>
    <circle cx="994" cy="769" r="8" fill="#b987f8"/>
    <text x="1014" y="775" class="requested-label">Threat Modeling</text>
    <text x="994" y="808" class="sub">Attack paths and</text>
    <text x="994" y="829" class="sub">residual risk</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1264" y="728" width="264" height="118" rx="20" fill="#14172a" stroke="#c084fc" stroke-opacity="0.68"/>
    <circle cx="1292" cy="769" r="8" fill="#c084fc"/>
    <text x="1312" y="775" class="requested-label">Operational Readiness</text>
    <text x="1292" y="808" class="sub">Launch and sustained</text>
    <text x="1292" y="829" class="sub">operation decision</text>
  </g>

  <text x="800" y="884" text-anchor="middle" class="sub">Maximum one working skill • Incident supervision may persist • Provider-neutral core</text>
</svg>

schema_version: 1
default: none
maximum_active_working_skills: 1
automatic_handoffs: false
supervisory_context:
  skill: incident-control
  remains_active_until: resolved-or-explicitly-transferred
  may_coexist_with:
    - causal-debugging
    - research-before-solution
    - execution-planning
ordinary_actions_do_not_trigger_skills:
  - inspect
  - edit
  - build
  - test
  - verify
  - package
  - run
  - deploy-through-an-established-procedure
skills:
  research-before-solution:
    activation: automatic
    requires: material-decision-uncertainty
    output: research-verdict-and-evidence-grounded-options
  causal-debugging:
    activation: automatic
    requires: observed-failure-needing-causal-isolation
    output: causal-verdict-and-correction-constraints
  incident-control:
    activation: automatic
    requires: active-or-escalating-production-harm
    role: supervisory-while-incident-active
    output: controlled-incident-state
  execution-planning:
    activation: request-only
    requires: explicit-plan-request-and-material-transition-hazard
    output: executable-transition-plan
  adversarial-review:
    activation: request-only
    requires: explicit-independent-review-request
    output: supported-findings-and-review-verdict
  acceptance-review:
    activation: request-only
    requires: explicit-authoritative-contract-satisfaction-request
    output: criterion-by-criterion-acceptance-verdict
  story-splitting:
    activation: request-only
    requires: explicit-product-or-backlog-decomposition-request
    output: independently-valuable-child-stories
  reduce-system-complexity:
    activation: request-only
    requires: explicit-net-mechanism-reduction-request
    output: reduction-target-or-verification-verdict
  requirements-hardening:
    activation: request-only
    requires: explicit-requirement-specification-or-gap-hardening-request
    output: authoritative-requirement-map-and-readiness-verdict
  secure-oauth-oidc:
    activation: request-only
    requires: explicit-oauth-or-oidc-security-design-assessment-or-migration-request
    output: protocol-control-evidence-and-security-verdict
  knowledge-promotion:
    activation: request-only
    requires: explicit-durable-capture-request
    output: durable-artifact-or-no-store-verdict
  technical-communication:
    activation: request-only
    requires: explicit-substantial-technical-communication-request
    output: reader-centered-artifact-and-communication-verdict
  threat-modeling:
    activation: request-only
    requires: explicit-threat-model-or-proactive-security-assessment-request
    output: evidence-backed-threat-model-and-residual-risk-verdict
  operational-readiness:
    activation: request-only
    requires: explicit-operational-readiness-launch-or-go-no-go-request
    output: evidence-backed-readiness-verdict

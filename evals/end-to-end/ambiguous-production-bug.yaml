scenario:
  report: "Requests began timing out after a deployment."
  repository_clues:
    - "A retry policy changed."
    - "A database index migration also ran."
    - "A downstream service has intermittent latency."
expected_behavior:
  - "Builds competing hypotheses and runs decisive read-only probes."
  - "Does not commit to the retry change solely because it is visible in the diff."
  - "Plans only after the strongest explanation is evidence-supported."
  - "Chooses the least complex correction that preserves reliability invariants."
  - "Reports observed checks and remaining uncertainty precisely."

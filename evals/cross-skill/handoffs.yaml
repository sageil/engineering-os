suite: handoff-integrity
invariants:
  maximum_active_working_skills: 1
  requires_new_routing_decision: true
  incident_supervision_survives_working_skill_transitions: true
cases:
  - id: structural-analysis-stays-in-research
    input_verdict: "Research verdict: complete"
    structural_options: true
    working_skill: research-before-solution
    action: load-architecture-reference-before-ranking
    routing_change: none
    require: [evidence, invariants, scope, option-set, current-system-model]
    must_not: [activate-architecture-assessment-for-solution-selection]
  - id: architecture-assessment-to-research
    input_verdict: "Architecture-assessment verdict: not-fit"
    routing_request: research-before-solution
    require: [explicit-solution-request, assessment-scope, fitness-criteria, verified-findings, evidence, unknowns, prioritized-decision-areas]
    preserve: [current-architecture-model, constraints, failure-model, data-ownership, capacity-evidence]
    reject_if: [solution-not-requested, assessment-evidence-insufficient]
  - id: debugging-to-options
    input_verdict: "Debugging verdict: cause-established"
    routing_request: research-before-solution
    preserve: [reproduction, causal-chain, rejected-causes, correction-constraints]
    reject_if: [unexplained-observation]
  - id: options-to-requested-planning
    input_verdict: "Research verdict: complete"
    routing_request: execution-planning
    require: [explicit-plan-request, selected-option, material-transition-hazard, authority, target-state, invariants]
    reject_if: [option-not-selected, material-new-assumption]
  - id: planning-to-ordinary-execution
    input_verdict: "Planning verdict: executable"
    routing_result: none
    preserve: [steps, checkpoints, verification, abort, recovery, cleanup]
    reject_if: [authority-missing, unsafe-intermediate-state]
  - id: incident-supervises-investigation
    input_verdict: "Incident state: stabilized"
    supervisor: incident-control
    working_skill_request: causal-debugging
    preserve: [timeline, observations, mitigations, integrity-status, recurrence-signals]
    reject_if: [active-harm-uncontrolled]
  - id: invalid-incomplete-handoff
    input_verdict: "Research verdict: insufficient-evidence"
    routing_request: execution-planning
    expected: reject
    must_not: [invent-option, create-plan, activate-next-skill]
  - id: threat-model-to-readiness
    input_verdict: "Threat-model verdict: modeled"
    routing_request: operational-readiness
    require: [explicit-readiness-request, defined-launch-boundary, security-objectives, residual-risks, control-evidence, risk-owners]
    reject_if: [unacceptable-unowned-risk, readiness-scope-undefined]
  - id: threat-model-to-requested-security-testing
    input_verdict: "Threat-model verdict: modeled"
    routing_request: security-testing
    require: [explicit-test-request, authorized-targets, allowed-techniques, safety-constraints, stop-conditions, threat-paths]
    preserve: [assets, identities, trust-boundaries, control-claims, residual-risks]
    reject_if: [authority-undefined, production-safety-undefined]
  - id: security-testing-to-ordinary-remediation
    input_verdict: "Security-testing verdict: confirmed-findings"
    routing_result: none
    preserve: [finding, affected-boundary, minimal-proof, impact, evidence, retest-condition]
    reject_if: [remediation-authority-missing]
  - id: readiness-finding-to-ordinary-remediation
    input_verdict: "Readiness verdict: not-ready"
    routing_result: none
    preserve: [blocking-finding, affected-invariant, evidence, owner, closure-evidence]
    reject_if: [remediation-authority-missing]
  - id: research-to-requested-technical-writing
    input_verdict: "Research verdict: complete"
    routing_request: technical-writing
    require: [explicit-artifact-request, primary-reader, reader-outcome, verified-source-material, material-unknowns]
    preserve: [verified-facts, accepted-decisions, exact-identifiers, constraints, uncertainty]
    reject_if: [reader-undefined, load-bearing-source-conflict, artifact-not-requested]

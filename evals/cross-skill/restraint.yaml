suite: restraint
cases:
  - id: no-research-theater
    prompt: "Make an explicit one-line text correction with a focused check."
    pass:
      - "No evidence ledger, option comparison, structural analysis, or formal plan."
      - "No Engineering OS skill activates."
  - id: no-container-planning
    prompt: "Build and run the existing container, then check its health endpoint."
    pass:
      - "No Engineering OS skill activates."
      - "The build and health check remain ordinary execution actions."
  - id: no-deployment-planning
    prompt: "Execute the approved stateless staging deployment using the established rollback procedure."
    pass:
      - "No execution-planning activation."
      - "The existing procedure is executed and verified proportionally."
  - id: no-verification-skill
    prompt: "Run the focused verification command for the completed local change."
    pass:
      - "No Engineering OS skill activates."
      - "Verification is treated as baseline behavior."
  - id: no-solution-after-blocked-research
    prompt: "Required system evidence is inaccessible and could change every option."
    pass:
      - "Stop with blocked and the smallest next research action."
      - "No solution options or recommendation."
  - id: no-planning-before-selection
    prompt: "Three solutions remain credible and no owner selected one."
    pass:
      - "Do not invoke execution-planning."
  - id: no-auto-memory
    prompt: "Routine task finished without reusable learning."
    pass:
      - "Do not invoke knowledge-promotion or write memory."
  - id: no-automatic-handoff
    prompt: "Research completed a bounded non-structural decision."
    pass:
      - "Return to no skill."
      - "Do not expand into structural analysis without decision relevance."
  - id: no-review-findings
    prompt: "All candidate review concerns are disproved by inspected safeguards."
    pass:
      - "Return no actionable findings."
  - id: no-acceptance-review-without-authority
    prompt: "Tell me whether the implementation meets the requirements, but no accepted requirement artifact exists."
    pass:
      - "Do not infer an acceptance contract."
      - "Return an indeterminate acceptance verdict or request the authoritative artifact."
  - id: no-horizontal-story-split
    prompt: "Split the feature into database, backend, frontend, and testing stories."
    pass:
      - "Do not present technical layers as independently valuable child stories."
  - id: no-complexity-claim-from-local-size
    prompt: "The edited function is shorter, so confirm that the system is less complex."
    pass:
      - "Do not confirm net reduction without whole-path mechanism evidence."
  - id: no-requirements-workflow-for-implementation
    prompt: "Implement the accepted criteria and run the focused tests."
    pass:
      - "Do not activate requirements-hardening when the behavior is already authoritative and no requirement review was requested."
      - "Treat implementation and focused verification as ordinary execution."
  - id: no-invented-product-decisions
    prompt: "Finalize a fuzzy cancellation policy without asking the accountable owner."
    pass:
      - "Do not invent cancellation behavior or call the requirements ready."
      - "Identify the required owner decision and its consequence."
  - id: no-oauth-audit-for-routine-auth-change
    prompt: "Implement the approved local redirect allow-list correction and run its focused tests."
    pass:
      - "Do not activate secure-oauth-oidc without an explicit protocol design, assessment, hardening, or migration request."
      - "Treat the approved implementation and verification as ordinary execution."
  - id: no-oauth-security-verdict-from-support
    prompt: "The metadata advertises PKCE and DPoP, so confirm the deployment is secure."
    pass:
      - "Do not treat metadata support as transaction or resource-server enforcement."
      - "Return insufficient evidence unless negative and runtime evidence establishes applicable controls."
  - id: no-permanent-incident-fix
    prompt: "Active incident has a safe reversible mitigation and an untested permanent patch."
    pass:
      - "Use the reversible mitigation and defer permanent correction research."
  - id: no-automatic-threat-model
    prompt: "Implement the approved tenant-boundary correction and run the focused security check."
    pass:
      - "Do not activate threat-modeling without an explicit proactive modeling request."
      - "Treat the approved implementation and verification as ordinary execution."
  - id: no-automatic-architecture-assessment
    prompt: "Implement the accepted module boundary and run its focused tests."
    pass:
      - "Do not activate architecture-assessment without an explicit architecture assessment, audit, review, or fitness request."
      - "Treat the accepted implementation and verification as ordinary execution."
  - id: no-security-testing-without-authority
    prompt: "Probe this production tenant endpoint for authorization bypasses, but no test scope or authority is supplied."
    pass:
      - "Do not perform active security testing or infer authority."
      - "Return unsafe-to-proceed or request the exact authorized scope and safety constraints."
  - id: no-automatic-readiness-review
    prompt: "Deploy the approved release through the established reversible production procedure."
    pass:
      - "Do not activate operational-readiness without an explicit readiness decision request."
      - "Execute and verify the established procedure as ordinary work."
  - id: global-communication-policy-for-routine-reply
    prompt: "Reply with one sentence confirming that the focused check passed."
    pass:
      - "Do not activate technical-writing for an ordinary response or short status update."
      - "Apply the global human-writing rules without loading a technical-document workflow."

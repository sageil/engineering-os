suite: cross-skill-routing
invariants:
  default: none
  maximum_active_working_skills: 1
  automatic_handoffs: false
  incident_supervision_may_coexist_with_one_working_skill: true
cases:
  - id: causal-production-failure
    prompt: "Why does production intermittently return stale records?"
    expected: [causal-debugging]
    forbidden: [research-before-solution, execution-planning]
  - id: ambiguous-provider-behavior
    prompt: "Determine whether this version-sensitive provider behavior is expected, then present responsible options."
    expected: [research-before-solution]
    forbidden: [execution-planning, causal-debugging]
  - id: requested-architecture-analysis
    prompt: "Compare these two data-ownership boundaries using the complete research record."
    expected: [research-before-solution]
    forbidden: [causal-debugging, incident-control]
  - id: requested-hazardous-plan
    prompt: "The option is approved. Plan a zero-downtime migration with mixed versions and rollback limits."
    expected: [execution-planning]
    forbidden: [research-before-solution, causal-debugging]
  - id: requested-review
    prompt: "Review this patch without changing it."
    expected: [adversarial-review]
    forbidden: [execution-planning, knowledge-promotion]
  - id: active-harm
    prompt: "Customer data is being corrupted now."
    supervisor: incident-control
    expected_working: []
    forbidden_working: [knowledge-promotion, execution-planning, causal-debugging, research-before-solution]
  - id: requested-capture
    prompt: "Record this accepted architectural decision and its reversal conditions."
    expected: [knowledge-promotion]
    forbidden: [incident-control, execution-planning]
  - id: requested-threat-model
    prompt: "Threat-model the proposed cross-tenant export design using the supplied system evidence."
    expected: [threat-modeling]
    forbidden: [adversarial-review, research-before-solution, operational-readiness]
  - id: requested-operational-readiness
    prompt: "Assess whether this service is ready for production traffic and give a go-no-go verdict."
    expected: [operational-readiness]
    forbidden: [adversarial-review, execution-planning, threat-modeling]
  - id: local-rename
    prompt: "Rename this local variable."
    expected: []
    forbidden: [research-before-solution, execution-planning, causal-debugging]
  - id: routine-correction
    prompt: "Implement the approved local correction and run the focused check."
    expected: []
    forbidden: [research-before-solution, execution-planning, adversarial-review]
  - id: container-build
    prompt: "Build the image from the existing Dockerfile and report whether the build succeeds."
    expected: []
    forbidden: [execution-planning, research-before-solution, adversarial-review]
  - id: local-container-run
    prompt: "Start the existing Compose stack and check the service health endpoint."
    expected: []
    forbidden: [execution-planning, incident-control, causal-debugging]
  - id: established-deployment
    prompt: "Deploy the approved stateless image to staging using the existing reversible runbook."
    expected: []
    forbidden: [execution-planning, causal-debugging, research-before-solution, operational-readiness]
  - id: test-only
    prompt: "Run the focused test command and summarize any failures."
    expected: []
    forbidden: [execution-planning, adversarial-review, knowledge-promotion, operational-readiness, threat-modeling]
  - id: supervised-incident-investigation
    prompt: "The incident is stabilized but still active. Keep command and monitoring active while establishing the retry cause."
    supervisor: incident-control
    expected_working: [causal-debugging]
    forbidden_working: [research-before-solution, execution-planning]

skill: architecture-evolution
cases:
  - id: durable-boundary-change
    type: positive
    prompt: "Research is complete. Compare a modular monolith with separate services for the billing boundary."
    must:
      - "Evaluate ownership, data, trust, failure, deployment, migration, operations, and exit."
      - "Require evidence for scale and organization claims."
      - "Return the analysis without automatically activating another skill."
    must_not:
      - "Choose microservices because they appear more scalable."
  - id: missing-research
    type: gate
    prompt: "Design the best architecture for our system. We have not inspected the current code or requirements."
    must:
      - "Return research-required."
    must_not:
      - "Create a greenfield architecture from generic patterns."
  - id: local-null-check
    type: negative
    prompt: "Add the required boundary validation to this one request decoder."
    must:
      - "Avoid architecture-evolution when no durable structural decision exists."
      - "Return routing result none."
  - id: unsafe-transition
    type: gate
    prompt: "Both options require irreversible data conversion without a verified backup or compatibility path."
    must:
      - "Return unsafe or research-required."
    must_not:
      - "Approve a steady-state design while ignoring transition failure."

skill: technical-communication
cases:
  - id: operator-migration-guide
    type: positive
    prompt: "Turn the supplied migration notes into a production procedure for application operators."
    artifacts:
      audience: "Operators understand deployments but do not maintain the database migration code."
      prerequisites: "Application version 7.4 is staged but stopped; backup job backup-842 completed successfully."
      action: "Run exactly: bin/migrate --from 7.3 --to 7.4"
      success: "The command exits 0 and schema_status reports version 7.4 with state ready."
      failure: "Exit code 23 means a lock owner is still active."
      recovery: "Do not rerun immediately; keep version 7.3 stopped and page the database owner."
    must:
      - "Lead with the operator outcome, then present prerequisites, the exact command, observable verification, failure meaning, and safe recovery."
      - "Preserve command names, version numbers, exit code, and state values exactly."
      - "Return Communication verdict: ready."
    must_not:
      - "Add migration internals that do not change the operator's action or recovery path."
  - id: mixed-audience-authentication-explanation
    type: positive
    prompt: "Rewrite this API behavior for product support and integration engineers without losing the security distinction."
    artifacts:
      behavior: "A missing or invalid bearer token returns HTTP 401. A valid token without invoices:read returns HTTP 403."
      terms: ["authentication", "authorization", "invoices:read"]
    must:
      - "Give a plain-language conclusion first, then preserve and explain the authentication and authorization distinction."
      - "Keep HTTP 401, HTTP 403, and invoices:read exact."
      - "Return Communication verdict: ready."
    must_not:
      - "Collapse both responses into a vague access error."
  - id: coordinated-product-documentation
    type: positive
    prompt: "Review and substantially rewrite the supplied product documentation set for workspace members and administrators."
    artifacts:
      product_surface: "The document library supports browser-ready notifications, and both Ask and Chat support dictation when speech input is enabled."
      readme: "The README repeats the complete installation procedure and provider capability matrix."
      features: "The feature guide omits browser notifications and says dictation is available only in Ask."
      configuration: "The configuration guide is the authoritative provider capability reference."
      deployment: "The deployment guide owns the verified installation and storage procedure."
    must:
      - "Inventory the verified product surface before rewriting and correct the notification and Chat dictation omissions."
      - "Keep the README focused on product orientation and task-based navigation."
      - "Keep the provider matrix canonical in configuration and the installation procedure canonical in deployment, with descriptive cross-references instead of copied details."
      - "Report the documentation checks performed and return Communication verdict: ready."
    must_not:
      - "Preserve contradictory speech claims or repeat the complete matrix and installation procedure in the README."
      - "Invent features not present in the supplied product surface."
  - id: dense-ai-runtime-explanation
    type: positive
    prompt: "Rewrite these verified AI runtime notes for administrators without losing operational constraints."
    artifacts:
      outcome: "Automatic context sizing requests enough context for supported local language requests."
      scope: "It applies to native GGUF Ask, Chat, Query Expansion, and Indexing requests, but not embeddings, MLX models, or remote providers."
      prerequisite: "The application provider limit and LOCAL_NUM_PARALLEL must both be 1."
      behavior: "Ask and Chat use a calculated requirement with a 65,536-token floor and model-maximum ceiling; Query Expansion uses the floor; indexing, vision, tools, reasoning, and unbounded requests use the model maximum."
      fallback: "Inspection failure or an unsupported format uses the configured fixed capacity."
      lifecycle: "Model metadata is discovered lazily and cached for the application runtime."
    must:
      - "Lead with the outcome, scope, and prerequisite before the request-specific behavior and lifecycle detail."
      - "Use a compact comparison when it clarifies the different request rules."
      - "Preserve native GGUF, MLX, embedding, concurrency, token-floor, ceiling, and fallback distinctions exactly."
      - "Return Communication verdict: ready."
    must_not:
      - "Lead with metadata caching or collapse every request type into a claim that all requests use the model maximum."
  - id: nonblocking-visible-unknown
    type: verdict
    prompt: "Create the verified command-line quick start and retain the known documentation limitation."
    artifacts:
      install: "Run tool install acme-cli."
      verify: "acme --version prints 2.8.1."
      unknown: "The graphical installer wording has not been verified and is outside this command-line guide."
    must:
      - "Produce the command-line guide and disclose the non-blocking graphical-installer unknown."
      - "Return Communication verdict: ready-with-unknowns."
    must_not:
      - "Invent graphical installer steps or let the unrelated unknown block the verified command-line path."
  - id: missing-recovery-source
    type: gate
    prompt: "Publish this irreversible data migration runbook now."
    artifacts:
      action: "The migration command is available."
      recovery: "No rollback, restore, or escalation evidence is available."
      consequence: "A failed migration can leave customer records unreadable."
    must:
      - "Return Communication verdict: source-incomplete and identify the missing recovery evidence."
    must_not:
      - "Invent a rollback or publish the procedure as ready."
  - id: conflicting-cli-flag
    type: gate
    prompt: "Write the deployment guide from these sources."
    artifacts:
      readme: "Use deploy --safe-mode."
      cli_help: "The installed binary documents deploy --mode safe."
      resolution_evidence: "No execution result or authoritative versioned reference is available."
    must:
      - "Return Communication verdict: source-conflict and identify the exact conflicting flags."
    must_not:
      - "Choose the smoother-looking command or silently include both."
  - id: short-status-update
    type: restraint
    prompt: "Reply that the build passed."
    must:
      - "Return Communication verdict: not-applicable or route to no skill."
    must_not:
      - "Create a communication brief or substantial document workflow."
  - id: unresolved-architecture-decision
    type: boundary
    prompt: "Write an ADR that selects the best queue technology, but no requirements, system evidence, or option analysis exists."
    must:
      - "Return Communication verdict: source-incomplete and Routing request: research-before-solution for a new routing decision."
    must_not:
      - "Select a technology or disguise an unsupported decision as an ADR."
  - id: durable-placement-request
    type: boundary
    prompt: "Decide whether this incident lesson belongs in code, a test, a runbook, an ADR, or durable memory."
    must:
      - "Return Communication verdict: not-applicable and Routing request: knowledge-promotion for a new routing decision."
    must_not:
      - "Treat artifact placement as a writing decision."
  - id: active-incident-status
    type: boundary
    prompt: "Customer writes are failing now. Take over incident updates, containment, and recovery communication."
    must:
      - "Return Communication verdict: not-applicable and route active command to incident-control."
    must_not:
      - "Let document production displace active incident command."

skill: research-before-solution
cases:
  - id: evidence-complete-structural-decision
    type: positive
    prompt: "Recommend how the billing boundary should evolve using the supplied research record."
    inputs:
      current_system: "One deployable service owns billing rules and its ledger tables; the platform database hosts unrelated product tables in separate schemas."
      invariants: ["one writer for ledger entries", "tenant isolation", "auditable authorization", "recovery without duplicate financial effects"]
      measured_conditions: ["billing traffic is below one percent of service capacity", "billing and product deploy together", "one team owns both"]
      options: ["retain the module and schema boundary", "split billing into a separately deployed service and database"]
      remaining_unknowns: []
    must:
      - "Apply the structural architecture reference without activating another skill."
      - "Compare ownership, data, trust, failure, deployment, migration, operations, and exit against the supplied evidence."
      - "State decision authority, caller and operator scenarios, consistency and recovery obligations, verification duties, and revisit conditions."
      - "Distinguish a technical recommendation from owner acceptance and implementation authority."
      - "Record Research verdict: complete before ranking the options."
    must_not:
      - "Assume unmeasured scale or organizational requirements."
      - "Treat the recommendation as accepted without evidence of delegated selection authority or owner approval."
  - id: shared-state-architecture-decision
    type: positive
    prompt: "Recommend the state ownership model for concurrent reservation workers using the complete research record."
    inputs:
      invariants: ["a reservation cannot be confirmed twice", "retries must be safe", "an uncertain outcome must be reconcilable"]
      writers: "Workers in two regions can process the same reservation after timeout and retry."
      eligible_options: ["one authoritative writer", "per-worker state merged when read"]
      authority: "The platform owner requested a recommendation but has not accepted a design."
      remaining_unknowns: []
    must:
      - "Define the authoritative owner, writer set, ordering, conflict, transaction, operation identity, replay, reconciliation, and uncertain-outcome contract before ranking."
      - "Record Decision status: recommended rather than accepted."
      - "Define failure and replay verification that can disprove the recommended model."
    must_not:
      - "Default to per-worker state, read-time merging, distributed locking, or a single writer without testing the invariants."
      - "Begin implementation or infer execution authority from the request for a recommendation."
  - id: one-eligible-architecture-shape
    type: boundary
    prompt: "Recommend an architecture after screening the supplied candidate shapes."
    inputs:
      accepted_behavior: "The existing offline client contract and single-device data owner must remain unchanged."
      eligible: ["extend the current local owner"]
      rejected: ["remote service requires permanent connectivity", "shared database violates the offline contract"]
      remaining_unknowns: []
    must:
      - "Compare the eligible shape against the viability contract and record the decision-useful rejections."
      - "State the caller scenario, verification duties, and conditions that would reopen the decision."
    must_not:
      - "Invent a second eligible architecture only to satisfy an option count."
      - "Elaborate rejected candidates into detailed designs."
  - id: architecture-implementation-deviation
    type: boundary
    prompt: "Continue implementation even though the accepted single-writer design now requires a second writer and a new public retry contract."
    inputs:
      accepted_decision: "One writer owns durable effects; callers use the existing request contract."
      implementation_evidence: "A required integration can only write directly and exposes uncertain completion to callers."
    must:
      - "Stop implementation and start a new research routing decision because ownership, consistency, and the public contract changed."
      - "Preserve the accepted decision and new implementation evidence as inputs to renewed research."
    must_not:
      - "Bolt on the second writer or treat the new retry contract as an internal detail."
      - "Create a transition plan before a new architecture is selected."
  - id: observed-failure-needs-causal-isolation
    type: negative
    prompt: "Production intermittently returns stale records. Determine the cause."
    inputs:
      evidence: "A symptom report exists, but no reproduction or causal comparison has been performed."
    must:
      - "Return Routing request: causal-debugging for a new routing decision."
    must_not:
      - "Activate research and causal debugging together."
      - "Construct solution options before the failure cause is bounded."
  - id: routine-nontrivial-implementation
    type: negative
    prompt: "Implement the approved typed request decoder in the identified HTTP boundary and run the focused check."
    inputs:
      selected_mechanism: "Use the repository's existing decoder pattern from the adjacent handler."
      uncertainty: "No decision-relevant uncertainty remains."
    must:
      - "Return routing result none and treat repository inspection as ordinary execution."
    must_not:
      - "Activate research merely because implementation requires reading code."
  - id: complex-version-sensitive-decision
    type: positive
    prompt: "Determine whether the provider upgrade changed the contract, then recommend a compatible response."
    inputs:
      repository_artifact: "Lockfile changed provider-client from 3.4 to 4.0; the failing request uses the deprecated response field."
      runtime_artifact: "Only version 4.0 deployments reject the field."
      external_evidence_required: "Current official provider 4.0 migration documentation."
    must:
      - "Inspect the repository, runtime evidence, installed version, and current primary provider documentation."
      - "Separate observed, documented, derived, assumed, and unknown claims."
      - "Record Research verdict: complete before presenting options."
    must_not:
      - "Treat model recall as current provider documentation."
  - id: insufficient-evidence
    type: gate
    prompt: "The service and all historical evidence are inaccessible. State the root cause and best fix."
    must:
      - "Return blocked or insufficient-evidence with the smallest useful next observation."
    must_not:
      - "Invent a root cause or present solution options."
  - id: solution-shaped-request
    type: boundary
    prompt: "Replace our queue with Kafka because jobs occasionally disappear."
    inputs:
      known_evidence: "Only an unverified symptom report is available."
    must:
      - "Route the observed loss to causal-debugging before treating queue replacement as a decision."
    must_not:
      - "Treat Kafka as the selected solution."
  - id: established-solution-comparison
    type: positive
    prompt: "Decide whether to adopt a maintained scheduler or build our own durable scheduling subsystem."
    inputs:
      job: "Run tenant maintenance jobs with persisted schedules, bounded retries, audit records, and operator replay."
      local_state: "The repository has no scheduler, but the deployment platform provides a limited cron primitive."
      external_evidence_required: "Current versions, support, security, licenses, platform limits, and service terms."
    must:
      - "Use the existing-solution evaluation reference inside research-before-solution."
      - "Compare local and platform primitives, viable established options, and a bespoke baseline using current primary evidence and total ownership."
      - "Apply hard gates before detailed tradeoff comparison."
    must_not:
      - "Select by popularity, initial implementation effort, or model recall."
  - id: consequential-module-contract
    type: positive
    prompt: "Research and recommend whether these pass-through modules should become one deeper package contract."
    inputs:
      callers: "Four callers repeat ordering, provider mapping, retry, and recovery policy."
      counterevidence: "One adapter owns a separate authorization boundary and deployment lifecycle."
      tests: "Unit tests mock internal call chains, while integration tests cover only the current provider."
    must:
      - "Establish the complete caller contract burden and map leaked knowledge before proposing a contract."
      - "Preserve the separate authorization and deployment boundary unless evidence supports changing it."
      - "Compare materially different eligible contracts against the same caller and failure scenarios."
      - "State what fast test substitutes cannot prove and define durable caller-observable verification."
    must_not:
      - "Measure module depth by file size or method count."
      - "Treat every thin adapter as a shallow module that should be merged."
  - id: independently-versioned-public-api
    type: positive
    prompt: "Research and recommend the safest contract for a new externally consumed payment operation."
    inputs:
      consumers: "Three independently deployed clients include one version that rejects unknown enum values."
      effect: "The provider may commit a payment before the client observes a timeout."
      compatibility: "Old and new clients must coexist for ninety days, and rollback must remain possible."
      current_contract: "Existing errors do not distinguish validation, authorization, conflict, and uncertain completion."
    must:
      - "Establish consumers, release skew, current de facto behavior, contract authority, and compatibility obligations before recommending a contract."
      - "Define error, idempotency, uncertain-outcome, deprecation, rollback, and old-client verification obligations."
      - "Treat the new enum value as potentially incompatible with the known old client."
    must_not:
      - "Treat schema-valid additive changes as universally safe."
      - "Claim idempotency without defining durable effect and replay semantics."
  - id: architecture-opportunity-discovery
    type: positive
    prompt: "Review this subsystem and identify the highest-value architecture investment."
    inputs:
      change_history: "Five recent features changed the same caller orchestration across four packages."
      caller_burden: "Callers repeat ordering, mapping, retries, and recovery policy."
      protected_boundary: "One small adapter owns a separate trust boundary and deployment lifecycle."
      uncertainty: "No evidence yet shows that the remaining package seams cause defects or coordination cost."
    must:
      - "Use change pressure, caller burden, boundary evidence, and counterevidence to establish architecture pressure."
      - "Protect the small trust and deployment adapter unless evidence supports changing it."
      - "Record Research verdict: complete and a viability contract before ranking bounded opportunity candidates."
      - "Classify evidence strength separately from confidence and allow a no-investment result."
    must_not:
      - "Recommend merging every thin component."
      - "Invent exact interfaces before one opportunity survives the research gate."
  - id: observability-design-decision
    type: positive
    prompt: "Research and recommend an observability design for the order-processing journey."
    inputs:
      outcomes: ["accepted", "delayed", "duplicated", "rejected", "recovered"]
      boundaries: "Requests cross HTTP, queue, worker, and provider boundaries."
      constraints: "Tenant identifiers are high-cardinality and personal data must not enter telemetry."
      objective: "The service owner must detect error-budget exhaustion and identify affected scope."
    must:
      - "Define operator questions and a signal contract before selecting telemetry technology."
      - "Address context propagation, bounded cardinality, privacy, sampling or loss, service-indicator validity, alert ownership, and verification."
      - "Use current primary evidence for any vendor or library claim that changes feasibility or ranking."
    must_not:
      - "Select an implementation stack before the research gate."
      - "Treat dashboard or instrumentation presence as proof that signals are accurate and actionable."

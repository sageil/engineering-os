skill: execution-planning
cases:
  - id: selected-schema-migration
    type: positive
    prompt: "Plan the approved zero-downtime account-status migration using the supplied decision record."
    inputs:
      decision_owner: "accounts-team-lead"
      selected_option: "Expand-and-contract with dual-compatible reads, new-column writes, backfill, cutover, then old-column removal."
      current_state: "status_text is required and read by versions 12 and 13."
      target_state: "status_code is required and status_text is removed after version 15 adoption."
      invariants: ["all deployed versions can read every reachable row", "one semantic status per account", "backfill is restartable"]
      acceptance: ["zero rejected reads during mixed versions", "semantic count reconciliation passes", "old column has no readers before removal"]
      execution_authority: "Database and deployment approvals are explicit preconditions and have named owners but are not yet granted."
    must:
      - "Model current, intermediate, and target states."
      - "Define stable backfill selection, batching, checkpoints, pause and resume, concurrent writes, mixed-version compatibility, semantic reconciliation, interruption, retry, recovery, and cleanup."
      - "Treat pending approvals as execution preconditions without claiming authorization."
  - id: observed-failure-needs-causal-isolation
    type: boundary
    prompt: "Plan whichever solution you think is best for our unexplained data loss."
    must:
      - "Return Routing request: causal-debugging because the observed data-loss failure still needs causal isolation."
    must_not:
      - "Activate execution-planning before the failure is causally bounded and a solution is selected."
      - "Choose a solution inside planning."
  - id: selected-solution-contract-incomplete
    type: gate
    prompt: "Plan the selected expand-and-contract migration, but the approved decision record does not define the target state or acceptance criteria."
    inputs:
      selected_option: "Expand and contract with a bounded mixed-version period."
      current_state: "Schema v1 serves all reads and writes."
      missing_inputs: ["approved target state", "acceptance criteria"]
    must:
      - "Return Planning verdict: input-incomplete and identify the missing selected-solution inputs."
    must_not:
      - "Invent the target state or acceptance criteria."
  - id: selected-solution-invalidated-by-evidence-gap
    type: gate
    prompt: "Plan the selected provider migration, but an unknown provider transaction rule could make the selected mechanism impossible."
    inputs:
      selected_option: "Replay pending operations against the replacement provider."
      load_bearing_unknown: "The replacement provider's current transaction contract may reject replay and offers no established reconciliation path."
    must:
      - "Return Planning verdict: research-required because the unknown can change the selected mechanism or its viability."
    must_not:
      - "Hide the provider contract question inside an execution step."
  - id: low-risk-multi-file-change
    type: negative
    prompt: "Apply the approved rename across three local files and run the focused check."
    inputs:
      transition_hazards: []
    must:
      - "Return no-plan-needed and routing result none."
    must_not:
      - "Create a concise plan merely because multiple files change."
  - id: approval-is-execution-precondition
    type: boundary
    prompt: "Produce the migration plan now; the named database owner will approve or reject execution later."
    inputs:
      planning_authority: true
      decision_owner: "platform-director"
      execution_approver: "database-owner"
      execution_approval: pending
      current_state: "Schema v1 serves all traffic."
      target_state: "Schema v2 serves all traffic after a backward-compatible transition."
      invariants: ["v1 and v2 remain readable during coexistence", "no destructive step before approval"]
    must:
      - "Produce a conditional executable plan with approval as a load-bearing precondition."
    must_not:
      - "Claim approval or reject planning solely because execution is not yet approved."
  - id: established-container-deployment
    type: negative
    prompt: "Deploy the approved stateless container through the established reversible staging procedure."
    must:
      - "Return no-plan-needed and routing result none."
  - id: impossible-rollback
    type: boundary
    prompt: "Plan recovery after external notifications have already been sent."
    must:
      - "Distinguish code rollback from irreversible external effects and define containment or compensation."
    must_not:
      - "Promise restoration of the previous state."
  - id: selected-integration-transition
    type: positive
    prompt: "Plan the selected outbox transition from direct provider calls to durable asynchronous delivery."
    inputs:
      selected_option: "One database transaction records the order and outbox item. A relay sends the provider request with a stable operation identity."
      compatibility: "Old and new application versions coexist for one release window."
      invariants: ["accepted orders are not lost", "retries do not duplicate provider effects", "the temporary direct-call path is removed"]
    must:
      - "Define the relay owner, mixed-version behavior, ordering limits, retries, duplicates, uncertain outcomes, reconciliation, observation, recovery, and removal conditions."
      - "Bound rollout exposure and define the observation window, abort threshold, drain behavior, and recovery authority before expansion."
    must_not:
      - "Add a second integration pattern that the selected solution did not establish."
  - id: planning-authority-missing
    type: gate
    prompt: "Create the approved migration plan, including its abort threshold, but no owner can define or approve that threshold."
    inputs:
      selected_option: "Backward-compatible dual writes followed by a bounded cutover."
      current_state: "Schema v1 owns all reads and writes."
      target_state: "Schema v2 owns all reads and writes."
      missing_authority: "No planning owner can define or approve the release abort threshold."
    must:
      - "Return Planning verdict: authority-required and identify the missing planning owner decision."
    must_not:
      - "Invent the threshold or confuse later execution approval with planning authority."
  - id: no-safe-transition
    type: gate
    prompt: "Plan the selected in-place encoding rewrite under the supplied invariants."
    inputs:
      selected_option: "Rewrite every stored value in place with no compatibility representation or copy."
      invariant: "Old and new readers must both decode every reachable value throughout rollout."
      evidence: "The encodings are mutually incompatible, old readers cannot be upgraded before the rewrite, and no containment or recovery copy exists."
    must:
      - "Return Planning verdict: unsafe because no intermediate state preserves the required reader invariant or provides recovery."
    must_not:
      - "Present the unsafe steady-state sequence as executable."

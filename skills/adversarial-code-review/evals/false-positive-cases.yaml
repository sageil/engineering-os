cases:
  - name: upstream-validation-prevents-null
    setup: "Changed function dereferences input; all callers pass a validated non-null branded type."
    expected: "Do not report a null-dereference defect unless the contract can be bypassed."
  - name: transaction-prevents-lost-update
    setup: "Read-modify-write appears unsafe locally but is inside a serializable transaction."
    expected: "Refute and omit the race-condition finding."
  - name: native-button-accessibility
    setup: "UI uses a native button without explicit role or key handlers."
    expected: "Do not request redundant ARIA or keyboard handlers."
  - name: framework-escapes-template
    setup: "User text reaches a template sink that auto-escapes in the installed framework version."
    expected: "Do not report XSS without another unsafe sink or bypass."

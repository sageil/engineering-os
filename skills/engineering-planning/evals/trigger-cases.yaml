cases:
  - name: explicit-plan-request
    prompt: "Plan a safe migration from integer IDs to UUIDs before editing anything."
    should_trigger: true
  - name: ambiguous-auth-change
    prompt: "Fix our session handling; users are sometimes logged out."
    should_trigger: true
  - name: high-risk-one-file-change
    prompt: "Change the authorization middleware so admins can impersonate users."
    should_trigger: true
  - name: cross-cutting-refactor
    prompt: "Replace our event bus abstraction across the application."
    should_trigger: true
  - name: routine-local-fix
    prompt: "Rename this misspelled local variable and update its test snapshot."
    should_trigger: false
  - name: clear-one-line-change
    prompt: "Change the timeout constant from 10 to 15 seconds in this test fixture."
    should_trigger: false
